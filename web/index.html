<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#20252c">
  <meta name="description" content="Kıvıl Web IDE: Türkçe programlarını yaz, dosyalarını sakla ve tarayıcıda çalıştır.">
  <title>Kıvıl Web IDE</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="./" aria-label="Kıvıl Web IDE"><svg viewBox="0 0 32 38" aria-hidden="true"><path d="M18 1c2 10-7 11-5 20 3-2 5-5 5-8 8 6 12 12 9 18-3 7-14 8-20 2C-1 25 5 15 10 11c-1 6 0 8 2 9C9 12 17 10 18 1Z" fill="currentColor"/></svg><span>Kıvıl</span><span class="brand-label">WEB IDE</span></a>
    <nav aria-label="Uygulama menüsü">
      <details id="examples-menu"><summary>Örnekler <span>⌄</span></summary><div class="menu" role="group" aria-label="Hazır örnekler"><button data-example="hello">Merhaba dünya</button><button data-example="conditions">Koşullar</button><button data-example="lists">Listeler</button><button data-example="functions">Fonksiyonlar</button><button data-example="input">Girdi</button></div></details>
      <button id="download" class="header-button">Kaydet</button>
      <button id="open-file" class="header-button">Yükle</button>
      <input type="file" id="file-input" accept=".kivil,.txt" multiple hidden>
      <a class="github-link" href="https://github.com/herdem-herdem/kivil-playground" target="_blank" rel="noreferrer">GitHub ↗</a>
    </nav>
    <div class="run-actions"><span class="shortcut"><kbd id="shortcut-key">⌘</kbd><kbd>↵</kbd></span><button id="stop" class="stop-button" disabled><span aria-hidden="true">■</span> Durdur</button><button id="run" class="run-button" disabled><span aria-hidden="true">▶</span> Çalıştır</button></div>
  </header>
  <main class="ide-layout">
    <section class="workbench" aria-label="Kod çalışma alanı"><div class="tabs-bar"><div id="file-tabs" class="file-tabs" role="tablist" aria-label="Açık dosyalar"></div><button id="new-file" class="new-tab" aria-label="Yeni sekme" title="Yeni sekme">+</button></div><div class="panes" id="panes">
      <section class="code-pane" id="editor-panel" role="tabpanel" aria-label="Kod editörü">
      <div class="editor-shell" id="editor-shell"><div class="line-number-clip" aria-hidden="true"><div id="line-numbers">1</div></div><div class="code-area"><pre id="highlight" aria-hidden="true"><code></code></pre><textarea id="editor" maxlength="65536" aria-label="Kıvıl kod editörü" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea></div></div>
      <div class="editor-footer"><span id="cursor-position">Satır 1, Sütun 1</span><span>UTF-8</span></div></section>
      <div id="resize-handle" class="resize-handle" role="separator" aria-label="Çıktı panelinin genişliği" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="60" aria-valuenow="36" tabindex="0"></div>
      <section class="output-pane" aria-label="Program çıktısı"><div class="pane-header output-header"><span class="terminal-title"><span aria-hidden="true">›_</span> Çıktı</span><div><button id="clear-output" title="Çıktıyı temizle">Temizle</button><button id="copy-output" aria-label="Çıktıyı kopyala">Kopyala</button></div></div><div class="output-body" id="output-body"><div class="empty-output" id="empty-output" aria-hidden="true"><span>›_</span></div><pre id="output" aria-live="polite" aria-atomic="true" tabindex="0" hidden></pre><div id="error" role="alert" hidden></div><button id="goto-error" hidden>Hatalı satıra git ↗</button></div><form id="input-form" hidden><label for="runtime-input">PROGRAM GİRDİ BEKLİYOR</label><div><input id="runtime-input" autocomplete="off" placeholder="Yanıtını yaz…" maxlength="8000"><button type="submit" aria-label="Girdiyi gönder">Gönder ↵</button></div></form><div class="output-footer"><span id="status" data-state="idle"><span></span> Hazırlanıyor</span><span id="duration">—</span></div></section>
    </div></section>
  </main>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
