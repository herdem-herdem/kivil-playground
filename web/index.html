<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f8">
  <meta name="description" content="Kıvıl kodlarını yazıp çalıştırabileceğin online editör.">
  <title>Kıvıl Online Editör</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="./" aria-label="Kıvıl">Kıvıl</a>
    <nav aria-label="Uygulama menüsü">
      <details id="examples-menu"><summary>Örnekler ▾</summary><div class="menu" role="group" aria-label="Hazır örnekler"><button data-example="hello">Merhaba dünya</button><button data-example="conditions">Koşullar</button><button data-example="lists">Listeler</button><button data-example="functions">Fonksiyonlar</button><button data-example="input">Girdi</button></div></details>
      <button id="download" class="header-button">Kaydet</button>
      <button id="open-file" class="header-button">Yükle</button>
      <input type="file" id="file-input" accept=".kivil,.txt" multiple hidden>
      <button id="new-file" class="header-button" aria-label="Yeni tarayıcı sekmesi">Yeni</button>
      <a class="github-link" href="https://github.com/herdem-herdem/kivil-playground" target="_blank" rel="noreferrer"><span>GitHub</span><span class="external-arrow" aria-hidden="true">↗</span></a>
    </nav>
    <div class="run-actions"><span class="shortcut"><kbd id="shortcut-key">⌘</kbd><kbd>↵</kbd></span><button id="stop" class="stop-button" disabled><span class="stop-symbol" aria-hidden="true">■</span><span class="stop-label">Durdur</span></button><button id="run" class="run-button" disabled>Çalıştır</button></div>
  </header>
  <main class="ide-layout">
    <section class="workbench" aria-label="Kod çalışma alanı"><div class="panes" id="panes">
      <section class="code-pane" id="editor-panel" aria-label="Kod editörü"><div class="code-header"><span id="filename">main.kivil</span></div>
      <div class="editor-shell" id="editor-shell"><div class="line-number-clip" aria-hidden="true"><div id="line-numbers">1</div></div><div class="code-area"><pre id="highlight" aria-hidden="true"><code></code></pre><textarea id="editor" maxlength="65536" aria-label="Kıvıl kod editörü" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea></div></div>
      <div class="editor-footer"><span id="cursor-position">Satır 1, Sütun 1</span><span>UTF-8</span></div></section>
      <div id="resize-handle" class="resize-handle" role="separator" aria-label="Çıktı panelinin genişliği" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="60" aria-valuenow="36" tabindex="0"></div>
      <section class="output-pane" aria-label="Program çıktısı"><div class="pane-header output-header"><span class="terminal-title">Çıktı</span><div><button id="clear-output" title="Çıktıyı temizle">Temizle</button><button id="copy-output" aria-label="Çıktıyı kopyala">Kopyala</button></div></div><div class="output-body" id="output-body"><div class="empty-output" id="empty-output" aria-hidden="true"><span>›_</span></div><pre id="output" aria-live="polite" aria-atomic="true" tabindex="0" hidden></pre><div id="error" role="alert" hidden></div><button id="goto-error" hidden>Hatalı satıra git ↗</button></div><form id="input-form" hidden><label for="runtime-input">PROGRAM GİRDİ BEKLİYOR</label><div><input id="runtime-input" autocomplete="off" placeholder="Yanıtını yaz…" maxlength="8000"><button type="submit" aria-label="Girdiyi gönder">Gönder ↵</button></div></form></section>
    </div></section>
  </main>
  <div id="blocked-tabs" hidden><span>Tarayıcı yeni sekmeyi engelledi. Açmak için dosyaya tıkla:</span><div id="pending-tabs"></div></div>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
